name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: 1.26.5
          cache: true

      - name: Install pinned release tools
        shell: pwsh
        run: |
          go install github.com/goreleaser/goreleaser/v2@v2.17.1
          go install github.com/anchore/syft/cmd/syft@v1.50.0

      - name: Test release source
        run: go test ./...

      - name: Build and publish archives
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: goreleaser release --clean

      - name: Attest Windows archives and checksums
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373
        with:
          subject-path: |
            dist/*.zip
            dist/checksums.txt
            dist/*.sbom
            dist/*.spdx.json
