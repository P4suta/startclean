name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  GOMAXPROCS: "2"

jobs:
  verify:
    name: Verify release source (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, windows-11-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.3
          cache: true
      - run: go run ./cmd/devtool test
      - run: go run ./cmd/devtool integration
      - run: go run ./cmd/devtool race
        if: runner.arch == 'X64'
      - run: go run ./cmd/devtool stress
      - run: go run ./cmd/devtool fuzz

  release:
    needs: verify
    runs-on: windows-2025
    timeout-minutes: 30
    permissions:
      artifact-metadata: write
      attestations: write
      contents: write
      id-token: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.3
          cache: true

      - name: Verify release tag is from main
        run: go run ./cmd/devtool release-preflight

      - name: Restore pinned release tools
        id: release-tools-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/bin
          key: release-go-${{ runner.os }}-${{ hashFiles('mise.toml') }}

      - name: Install pinned release tools
        if: steps.release-tools-cache.outputs.cache-hit != 'true'
        run: go run ./cmd/devtool tools release

      - name: Validate release inputs
        run: go run ./cmd/devtool release-check

      - name: Build and stage draft release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: goreleaser release --clean

      - name: Verify staged release artifacts
        run: go run ./cmd/devtool release-verify

      - name: Attest checksummed release artifacts
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-checksums: dist/checksums.txt

      - name: Attest checksum manifest
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: dist/checksums.txt

      - name: Publish fully assembled draft release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: go run ./cmd/devtool release-publish
