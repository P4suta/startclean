name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version: 1.26.5
          cache: true

      - name: Install pinned release tools
        shell: pwsh
        run: |
          go install github.com/goreleaser/goreleaser/v2@v2.17.1
          go install github.com/anchore/syft/cmd/syft@v1.50.0

      - name: Test release source
        run: go test ./...

      - name: Build and publish archives
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: goreleaser release --clean

      - name: Attest Windows archives and checksums
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be
        with:
          subject-path: |
            dist/*.zip
            dist/checksums.txt
            dist/*.sbom
            dist/*.spdx.json
