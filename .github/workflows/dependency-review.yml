name: Dependency review

on:
  pull_request:
    branches:
      - main
    paths:
      - 'go.mod'
      - 'go.sum'
      - '.github/dependency-review-config.yml'
      - '.github/workflows/dependency-review.yml'

permissions:
  contents: read

concurrency:
  group: dependency-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  dependency-review:
    name: Review dependency changes
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select the reviewed Go license exception
        id: licenses
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          exception='pkg:golang/golang.org/x/sys@0.50.0'
          accepted=$(gh api --paginate --slurp \
            "repos/$GITHUB_REPOSITORY/dependency-graph/compare/$BASE_SHA...$HEAD_SHA" |
            jq -r --arg exception "$exception" '
              [.[][] | select(.change_type == "added" and .ecosystem == "gomod" and
                (.name | ascii_downcase) == "golang.org/x/sys")] |
              if length > 0 and all(.[]; .package_url == $exception and
                .license == "BSD-3-Clause AND LicenseRef-scancode-google-patent-license-golang")
              then $exception else "" end')
          printf 'accepted=%s\n' "$accepted" >> "$GITHUB_OUTPUT"

      - name: Review dependency changes
        uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          config-file: ./.github/dependency-review-config.yml
          allow-dependencies-licenses: ${{ steps.licenses.outputs.accepted }}
