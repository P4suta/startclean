name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows quality gate
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.5
          cache: true

      - name: Verify module integrity
        run: go run ./cmd/devtool module-verify

      - name: Verify formatting
        run: go run ./cmd/devtool format --check

      - name: Verify generated files
        run: go run ./cmd/devtool generate --check

      - name: Vet
        run: go run ./cmd/devtool vet

      - name: Unit tests
        run: go run ./cmd/devtool test

      - name: Real Shell Link COM integration test
        run: go run ./cmd/devtool integration

      - name: Stress Windows deletion safety and COM integration
        run: go run ./cmd/devtool stress

      - name: Install pinned coverage tool
        run: go run ./cmd/devtool tools coverage

      - name: Coverage
        run: go run ./cmd/devtool coverage

      - name: Build Windows x64 and arm64
        run: go run ./cmd/devtool build

      - name: Upload test binaries and coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-ci-artifacts
          path: |
            coverage*.out
            dist/*.exe
          if-no-files-found: error

  race:
    name: Race detector
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.5
          cache: true

      - name: Run race-enabled tests
        run: go run ./cmd/devtool race

  fuzz:
    name: Safety fuzzing
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.5
          cache: true

      - name: Fuzz deletion-safety invariants
        run: go run ./cmd/devtool fuzz

      - name: Preserve newly discovered fuzz failures
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-failure-corpus-${{ github.run_id }}-${{ github.run_attempt }}
          path: internal/core/testdata/fuzz/**
          if-no-files-found: ignore
          retention-days: 14

  policy:
    name: Lint, security, license, and release policy
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.5
          cache: true

      - name: Validate pull request title
        if: github.event_name == 'pull_request'
        env:
          STARTCLEAN_PR_TITLE: ${{ github.event.pull_request.title }}
        run: go run ./cmd/devtool pr-title

      - name: Install pinned policy tools
        run: go run ./cmd/devtool tools policy

      - name: Lint source, workflows, and prose
        run: go run ./cmd/devtool lint

      - name: Vulnerability and secret scans
        run: go run ./cmd/devtool security

      - name: REUSE 3.3 compliance
        run: go run ./cmd/devtool reuse

      - name: Verify release source
        run: go run ./cmd/devtool release-source

      - name: GoReleaser configuration
        run: go run ./cmd/devtool release-check

  release-smoke:
    name: Release snapshot smoke test
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.5
          cache: true

      - name: Install pinned release tools
        run: go run ./cmd/devtool tools release

      - name: Build and verify release snapshot
        run: go run ./cmd/devtool release-smoke
