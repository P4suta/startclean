name: CI

on:
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GOMAXPROCS: "2"

jobs:
  changes:
    name: Workflow and metadata checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    outputs:
      runtime: ${{ steps.changes.outputs.runtime }}
      release: ${{ steps.changes.outputs.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: changes
        with:
          base: ${{ github.event.merge_group.base_sha || github.event.repository.default_branch }}
          filters: .github/filters/ci.yml
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: v2026.10.14
          install_args: jq actionlint typos taplo uv pipx:reuse gitleaks
      - run: actionlint
      - run: jq -L .github -n -e -f .github/check-required.jq
      - run: typos
      - run: taplo format --check
      - run: reuse lint
      - run: gitleaks git . --redact

  windows:
    name: Windows quality gate
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.runtime == 'true'
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.3
          cache: true

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: v2026.10.14
          install_args: go golangci-lint go:golang.org/x/vuln/cmd/govulncheck go:github.com/google/osv-scanner/v2/cmd/osv-scanner

      - name: Validate pull request title
        if: github.event_name == 'pull_request'
        env:
          STARTCLEAN_PR_TITLE: ${{ github.event.pull_request.title }}
        run: go run ./cmd/devtool pr-title

      - name: Verify module integrity
        run: go run ./cmd/devtool module-verify

      - name: Verify formatting
        run: go run ./cmd/devtool format --check

      - name: Verify generated files
        run: go run ./cmd/devtool generate --check

      - name: Vet
        run: go run ./cmd/devtool vet

      - name: Unit tests
        run: go run ./cmd/devtool test

      - name: Real Shell Link COM integration test
        run: go run ./cmd/devtool integration

      - name: Restore pinned coverage tool
        id: coverage-tools-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/bin
          key: coverage-go-${{ runner.os }}-${{ hashFiles('mise.toml') }}

      - name: Install pinned coverage tool
        if: steps.coverage-tools-cache.outputs.cache-hit != 'true'
        run: go run ./cmd/devtool tools coverage

      - name: Coverage
        run: go run ./cmd/devtool coverage

      - name: Build Windows x64 and arm64
        run: go run ./cmd/devtool build

      - name: Run race-enabled tests
        run: go run ./cmd/devtool race

      - name: Lint Go source
        run: golangci-lint run ./...

      - name: Go vulnerability scans
        run: |
          govulncheck ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          osv-scanner scan source --recursive .

  release-check:
    name: Release configuration
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.release == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: v2026.10.14
          install_args: go goreleaser

      - name: Validate release configuration
        run: go run ./cmd/devtool release-check

  required:
    name: required
    if: always()
    needs: [changes, windows, release-check]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: v2026.10.14
          install_args: jq
      - name: Require every selected job to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
          FULL: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          set -euo pipefail
          jq -L .github -e --argjson full "$FULL" 'include "required"; required($full)' <<< "$RESULTS"
