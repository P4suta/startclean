name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows quality gate
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: 1.26.5
          cache: true

      - name: Verify formatting
        shell: pwsh
        run: |
          $files = @(gofmt -l .)
          if ($files.Count -ne 0) {
            $files
            throw "gofmt changes required"
          }

      - name: Verify generated files
        shell: pwsh
        run: |
          go generate ./...
          git diff --exit-code

      - name: Vet
        run: go vet ./...

      - name: Unit tests
        run: go test ./...

      - name: Real Shell Link COM integration test
        run: go test -tags=integration ./internal/platform

      - name: Coverage
        shell: pwsh
        run: |
          go test -covermode atomic -coverprofile coverage.out ./...
          go tool cover -func=coverage.out

      - name: Build Windows x64
        shell: pwsh
        run: |
          $env:CGO_ENABLED = "0"
          $env:GOARCH = "amd64"
          go build -trimpath -o dist/startclean-windows-x64.exe ./cmd/startclean

      - name: Build Windows arm64
        shell: pwsh
        run: |
          $env:CGO_ENABLED = "0"
          $env:GOARCH = "arm64"
          go build -trimpath -o dist/startclean-windows-arm64.exe ./cmd/startclean

      - name: Upload test binaries and coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: windows-ci-artifacts
          path: |
            coverage.out
            dist/*.exe
          if-no-files-found: error

  policy:
    name: Lint, security, license, and release policy
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: 1.26.5
          cache: true

      - name: Install pinned Go tools
        shell: pwsh
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2
          go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          go install github.com/goreleaser/goreleaser/v2@v2.17.1
          go install github.com/gitleaks/gitleaks/v8@v8.30.1

      - name: Go lint
        run: golangci-lint run ./...

      - name: Workflow lint
        run: actionlint

      - name: Vulnerability scan
        run: govulncheck ./...

      - name: Secret scan
        run: gitleaks dir . --redact

      - name: REUSE 3.3 compliance
        shell: pwsh
        run: |
          py -m pip install uv==0.12.0
          uvx --from reuse==6.2.0 reuse lint

      - name: GoReleaser configuration
        run: goreleaser check
