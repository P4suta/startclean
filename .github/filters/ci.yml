runtime:
  - '**/*.go'
  - 'go.mod'
  - 'go.sum'
  - 'mise.toml'
  - 'mise.lock'
  - '.golangci*'
  - '.github/workflows/ci.yml'
  - '.github/filters/**'
  - '.github/*.jq'
release:
  - '.goreleaser.yml'
  - 'cmd/devtool/**'
  - '.github/workflows/release.yml'
  - '.github/workflows/ci.yml'
  - '.github/filters/**'
  - '.github/*.jq'
actions:
  - '.github/**'
