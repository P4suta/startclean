name: Bug report
description: Report reproducible behavior that is incorrect or unsafe.
title: "bug: "
labels:
  - bug
  - needs-triage
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping improve startclean. Please do not include secrets or
        sensitive file paths. startclean permanently deletes selected shortcuts,
        so safety-related reports are especially valuable.

  - type: input
    id: version
    attributes:
      label: startclean version
      description: Run `startclean version` and paste the complete output.
      placeholder: startclean 1.2.3 (commit ..., built ...)
    validations:
      required: true

  - type: dropdown
    id: architecture
    attributes:
      label: Windows architecture
      options:
        - x64
        - ARM64
        - Other or unknown
    validations:
      required: true

  - type: input
    id: windows
    attributes:
      label: Windows version
      description: Include the edition, version, and OS build shown by `winver`.
      placeholder: Windows 11 24H2, OS build 26100.x
    validations:
      required: true

  - type: dropdown
    id: installation
    attributes:
      label: Installation source
      options:
        - GitHub release
        - Built from source
        - Other
    validations:
      required: true

  - type: input
    id: command
    attributes:
      label: Command or launch method
      description: Include all arguments, or say that you double-clicked the executable.
      placeholder: startclean scan --format json
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Provide the smallest reliable sequence that demonstrates the problem.
      placeholder: |
        1. Run ...
        2. Select ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include the full error message and exit code, if available.
    validations:
      required: true

  - type: textarea
    id: doctor
    attributes:
      label: Doctor output
      description: Paste `startclean doctor` output after removing sensitive paths.
      render: text

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add screenshots or other details that may help diagnosis.

  - type: checkboxes
    id: checklist
    attributes:
      label: Submission checklist
      options:
        - label: I searched open and closed issues for an existing report.
          required: true
        - label: I reproduced this with the latest available release or current main branch.
          required: true
        - label: I removed secrets and sensitive personal paths from the report.
          required: true
