[tools]
go = "1.27.4"
just = "1.59.0"
lefthook = "2.2.2"
golangci-lint = "2.15.0"
goreleaser = "2.20.2"
actionlint = "1.7.12"
jq = "1.8.2"
typos = "1.52.2"
taplo = "0.10.0"
syft = "1.57.1"
gitleaks = "8.30.1"
uv = "0.13.8"
"go:golang.org/x/vuln/cmd/govulncheck" = "1.6.0"
"go:github.com/google/osv-scanner/v2/cmd/osv-scanner" = "v2.7.1"
"go:github.com/vladopajic/go-test-coverage/v2" = "v2.23.0"
"pipx:reuse" = { version = "6.3.0", depends = ["uv"], extras = "charset-normalizer" }

[settings]
experimental = true
idiomatic_version_file_enable_tools = ["go"]
