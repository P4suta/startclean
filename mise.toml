[tools]
go = "1.26.5"
just = "1.57.0"
lefthook = "2.1.10"
golangci-lint = "2.12.2"
goreleaser = "2.17.1"
actionlint = "1.7.12"
typos = "1.48.0"
taplo = "0.10.0"
syft = "1.50.0"
gitleaks = "8.30.1"
uv = "0.12.0"
"go:golang.org/x/vuln/cmd/govulncheck" = "1.6.0"
