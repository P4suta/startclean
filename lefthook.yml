pre-commit:
  parallel: true
  commands:
    format:
      glob: "*.go"
      run: gofmt -w {staged_files}
      stage_fixed: true
    generated:
      run: go generate ./... && git diff --exit-code
    lint:
      run: golangci-lint run ./...
    test:
      run: go test ./...
    reuse:
      run: reuse lint
    secrets:
      run: gitleaks protect --staged --redact

commit-msg:
  commands:
    conventional:
      run: >-
        pwsh -NoLogo -NoProfile -Command
        "$message = Get-Content -Raw '{1}';
        if ($message -notmatch '^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9._-]+\))?!?: .+') {
        throw 'Commit message must use Conventional Commits.' }"
