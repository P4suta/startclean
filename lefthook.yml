pre-commit:
  parallel: false
  commands:
    format:
      run: go run ./cmd/devtool format --check
    generated:
      run: go run ./cmd/devtool generate --check
    lint:
      run: go run ./cmd/devtool lint
    test:
      run: go run ./cmd/devtool test
    reuse:
      run: go run ./cmd/devtool reuse
    secrets:
      run: go run ./cmd/devtool secrets

commit-msg:
  commands:
    conventional:
      run: go run ./cmd/devtool commit-msg "{1}"
